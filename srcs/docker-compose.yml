services:
  mariadb:
    container_name: mariadb_container
    env_file: .env
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    restart: on-failure
    volumes: 
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - inception_network

  wordpress:
    container_name: wordpress_container
    env_file: .env
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    restart: on-failure
    volumes:
      - wordpress_data:/var/www/wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_password
    networks:
      - inception_network

  nginx:
    container_name: nginx_container
    env_file: .env
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    restart: on-failure
    ports:
    - "443:443"
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - wordpress
      - adminer
      - static_web_site
      - portainer
    networks:
    - inception_network

  adminer:
    container_name: adminer_container
    env_file: .env
    build:
      context: ./requirements/adminer
      dockerfile: Dockerfile
    image: adminer
    restart: on-failure
    depends_on:
      - mariadb
    networks:
      - inception_network

  static_web_site:
    container_name: static_web_container
    env_file: .env
    build:
      context: ./requirements/nginx/website
      dockerfile: Dockerfile
    image: nginx-static-site
    restart: on-failure
    networks:
      - inception_network

  redis:
    container_name: redis_container
    build:
      context: ./requirements/redis
      dockerfile: Dockerfile
    image: redis
    restart: on-failure
    networks:
      - inception_network

  portainer:
    container_name: portainer_container
    build:
      context: ./requirements/portainer
      dockerfile: Dockerfile
    image: portainer
    restart: on-failure
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    secrets:
      - pt_password
    networks:
      - inception_network

  ftp:
    container_name: ftp_container
    env_file: .env
    build:
      context: ./requirements/ftp
      dockerfile: Dockerfile
    image: ftp
    restart: on-failure
    ports:
      - "21:21"
      - "42000-42010:42000-42010"
    volumes :
      - wordpress_data:/var/www/wordpress
    secrets:
      - ftp_password
    networks:
      - inception_network

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/volt/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/volt/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/volt/data/portainer

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
  pt_password:
    file: ../secrets/pt_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
networks:
  inception_network:
    driver: bridge